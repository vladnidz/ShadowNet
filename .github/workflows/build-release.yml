name: Build ShadowNet Watch APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowNet-v1.1.0.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowNet-v1.1.0-APK
          path: release-output/ShadowNet-v1.1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "ShadowNet v1.1.0 (Spy Cam & AirTag Tracker Hunter)"
          body: |
            ### 🛰 ShadowNet v1.1.0 — Spy Cam & AirTag Tracker Hunter
            - **Spy Cam Detector**: Deep probes subnet for RTSP 554, ONVIF 8899, and Hikvision/Dahua 8000 ports. Discovered cameras immediately float to the top with red alert styling.
            - **Anti-Stalker / AirTag Radar**: Decodes BLE manufacturer frames (Apple FindMy / AirTag `0x004C`, Samsung SmartTag `0x0075`, Tile `0xFEED`).
            - **Haptic Proximity Alert**: Clock vibrates physically on wrist when you get within 1-2 meters of a hidden tracker.
            - **Port Audit & Ping Diagnostic**: Retained full port checker and real-time latency monitor.
          files: release-output/ShadowNet-v1.1.0.apk
